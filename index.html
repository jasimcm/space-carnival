<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Carnival — TinkerSpace</title>
<meta name="description" content="Space Carnival, Dec 19 & 20 at TinkerSpace Kochi. Celebrating four years of TinkerSpace.">
<meta name="theme-color" content="#5c0fdb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Built from the "Space carnival - 04" Figma file:
     desktop follows the "TV - 2" frame (1280x720), phones follow "Instagram post - 3" (1080 wide). */
  :root {
    --violet: #5c0fdb;
    --yellow: #fde900;
    --cream: #fefce3;
    --ink: #000;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--violet); color: #fff; font-family: "Poppins", system-ui, sans-serif; }
  /* the crayon texture sits on the violet in overlay mode, exactly like the Figma layer */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: url("assets/carnival/texture.jpg") center / cover;
    mix-blend-mode: overlay; transform: rotate(180deg);
  }

  /* artboard in Figma units, scaled to fit by the script at the bottom */
  .stage {
    position: absolute; left: 0; bottom: 0;
    width: 1280px; height: 720px;
    transform-origin: 0 100%; transform: scale(var(--s, 1));
  }
  .stage > * { position: absolute; }
  .stage img { display: block; }

  .brand { left: 61px; top: 37px; width: 196px; }
  .wordmark { left: 1057px; top: 32px; width: 162px; }
  .brand img, .wordmark img { width: 100%; }

  .script {
    left: 218px; top: 125px; width: 1030px; height: 193px;
    display: flex; align-items: center; justify-content: center;
    font: 400 123.5px/108px "Homemade Apple", cursive; white-space: nowrap;
    transform: rotate(4.74deg);
  }
  .script br { display: none; }

  .building { left: 0; top: 162px; width: 935px; }
  .mouse { left: 687px; top: 238px; width: 248px; animation: bob 2.8s ease-in-out infinite; }
  .frog { left: 2px; top: 64px; width: 165px; transform: rotate(21.88deg); }
  .frog img { width: 100%; animation: bob 3.4s ease-in-out infinite -1s; }
  .stage .bear { display: none; }
  @keyframes bob { 50% { translate: 0 -6px; } }

  .when { left: 968px; top: 392px; transform: rotate(-4.34deg); transform-origin: 0 0; }
  .when .date { font-weight: 800; font-size: 50px; line-height: 1; letter-spacing: -.03em; }
  .when .date span { color: var(--yellow); }
  .when .sub { margin-top: 10px; font-weight: 600; font-size: 18px; color: var(--cream); }

  /* the yellow "Apply with" sticker from the poster, pointing at the badge competition */
  .sticker {
    left: 962px; top: 548px; width: 268px; padding: 12px 18px 13px;
    background: var(--yellow); color: var(--ink); border: 3px solid var(--ink); border-radius: 19px;
    text-decoration: none; transform: rotate(-4.34deg);
    box-shadow: 0 6px 0 var(--ink);
    transition: transform .15s, box-shadow .15s;
  }
  .sticker:hover { transform: rotate(-4.34deg) translateY(-3px); box-shadow: 0 9px 0 var(--ink); }
  .sticker:active { transform: rotate(-4.34deg) translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .sticker:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
  .sticker b { display: block; font-weight: 700; font-size: 19px; line-height: 1.1; letter-spacing: -.04em; }
  .sticker small { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-weight: 600; font-size: 14px; letter-spacing: -.02em; }
  .sticker small i { width: 9px; height: 9px; border-radius: 50%; background: #16a34a; }
  .sticker small em { margin-left: auto; font-style: normal; font-size: 18px; }

  .fade { animation: fade .8s ease-out backwards; }
  .script.fade { animation-delay: .1s; }
  .when.fade { animation-delay: .35s; }
  .sticker.fade { animation-delay: .5s; }
  @keyframes fade { from { opacity: 0; } }

  /* Phones: the portrait poster, with the date and sticker in the sky between title and roof */
  @media (max-aspect-ratio: 4/5) {
    .stage { left: 50%; width: 1080px; height: 2300px; transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--s, 1)); }
    .brand { left: 36px; top: 124px; width: 268px; }
    .wordmark { left: 824px; top: 117px; width: 222px; }
    .script { left: 108px; top: 300px; width: 872px; height: 498px; font-size: 200px; line-height: 181px; transform: rotate(-9.85deg); }
    .script br { display: inline; }
    .when { left: 64px; top: 852px; transform: rotate(-4.34deg); }
    .when .date { font-size: 104px; }
    .when .sub { font-size: 36px; margin-top: 16px; }
    .sticker { left: 64px; top: 1060px; width: 600px; padding: 22px 34px 24px; border-width: 5px; border-radius: 34px; box-shadow: 0 11px 0 var(--ink); }
    .sticker b { font-size: 40px; }
    .sticker small { font-size: 30px; gap: 14px; margin-top: 10px; }
    .sticker small i { width: 18px; height: 18px; }
    .sticker small em { font-size: 38px; }
    .building { left: -18px; top: 1535px; width: 1233px; }
    .stage .bear { display: block; left: 641px; top: 1086px; width: 583px; animation: bob 3.1s ease-in-out infinite -1.6s; }
    .mouse { left: 300px; top: 1304px; width: 479px; }
    .frog { left: 2px; top: 1272px; width: 290px; }
    @keyframes bob { 50% { translate: 0 -12px; } }
  }

  @media (prefers-reduced-motion: reduce) {
    .fade, .mouse, .frog img, .bear { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Space Carnival at TinkerSpace Kochi, December 19 and 20">
    <img class="building" src="assets/carnival/building.webp" alt="Crayon drawing of TinkerSpace strung with fairy lights">
    <img class="bear" src="assets/carnival/bear.webp" alt="">
    <img class="mouse" src="assets/carnival/mouse.webp" alt="">
    <div class="frog"><img src="assets/carnival/frog.webp" alt=""></div>

    <div class="brand"><img src="assets/logo.png" alt="TinkerSpace Kochi"></div>
    <div class="wordmark"><img src="assets/carnival/wordmark.svg" alt=""></div>

    <h1 class="script fade">Space <br>Carnival</h1>

    <div class="when fade">
      <p class="date">Dec 19 <span>&amp;</span> 20</p>
      <p class="sub">TinkerSpace turns four · Kochi</p>
    </div>

    <a class="sticker fade" href="badge/">
      <b>PCB Badge Design Competition</b>
      <small><i aria-hidden="true"></i>Open · closes Nov 26<em aria-hidden="true">→</em></small>
    </a>
  </main>

<script>
  const portrait = matchMedia('(max-aspect-ratio: 4/5)');
  const fit = () => {
    const [w, h] = portrait.matches ? [1080, 2300] : [1280, 720];
    const el = document.documentElement;
    el.style.setProperty('--s', Math.min(el.clientWidth / w, el.clientHeight / h));
  };
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
