<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Carnival — TinkerSpace</title>
<meta name="description" content="Space Carnival, Dec 19 & 20. Celebrating four years of TinkerSpace.">
<meta name="theme-color" content="#1c0cec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #1c0cec;
    --yellow: #ffd400;
    --ink: #10082e;
    --white: #fff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  /* crayon sky straight from the Figma artboard */
  body {
    background: var(--sky) url("assets/carnival/sky.jpg") center / cover no-repeat;
    color: var(--white);
    font-family: "Poppins", system-ui, sans-serif;
  }

  /* 1920x1080 artboard for the text, scaled to fit and pinned to the bottom */
  .stage {
    position: absolute; left: 50%; bottom: 0; z-index: 3;
    width: 1920px; height: 1080px;
    transform-origin: 50% 100%;
    transform: translateX(-50%) scale(var(--s, 1));
  }
  .stage > * { position: absolute; }

  .brand { left: 96px; top: 70px; width: 330px; }
  .brand img { display: block; width: 100%; }

  .title { left: 84px; top: 150px; width: 640px; }
  .title img { display: block; width: 100%; filter: drop-shadow(0 8px 0 rgba(16, 8, 46, .35)); }

  .date { left: 100px; top: 492px; font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: -.03em; }
  .date span { color: var(--yellow); }

  .tagline { left: 102px; top: 600px; max-width: 660px; font-weight: 500; font-size: 28px; line-height: 1.35; color: rgba(255, 255, 255, .9); }

  /* badge competition call-to-action, the yellow pill from the Figma posters */
  .badge-cta {
    left: 100px; top: 730px; display: inline-flex; align-items: center; gap: 16px; height: 76px; padding: 0 28px 0 12px;
    border-radius: 999px; text-decoration: none; color: var(--ink); white-space: nowrap;
    font-weight: 700; font-size: 24px; letter-spacing: -.01em;
    background: var(--yellow); border: 3px solid var(--ink); box-shadow: 0 7px 0 var(--ink);
    transition: transform .15s, box-shadow .15s;
  }
  .badge-cta:hover { transform: translateY(-3px); box-shadow: 0 10px 0 var(--ink); }
  .badge-cta:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
  .badge-cta:focus-visible { outline: 4px solid var(--white); outline-offset: 6px; }
  .badge-cta .tag {
    display: inline-flex; align-items: center; gap: 9px; height: 50px; padding: 0 20px; border-radius: 999px;
    background: var(--white); border: 2px solid var(--ink); font-size: 19px;
  }
  .badge-cta .dot { width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
  .badge-cta .meta { font-weight: 500; font-size: 20px; opacity: .7; }
  .badge-cta svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
  .badge-cta:hover svg { transform: translateX(4px); }

  /* The carnival scene is pinned to the window's bottom-right corner.
     Characters are placed in % of the building so they stay on the roof at any size. */
  .scene {
    position: fixed; right: 0; bottom: 0; z-index: 1; pointer-events: none;
    width: min(calc(1150px * var(--s, 1)), 100vw); aspect-ratio: 1800 / 1131;
  }
  .scene img { position: absolute; display: block; }
  .scene .building { inset: 0; width: 100%; }
  .frog     { left: 0;     top: -27%; width: 14.5%; animation: bob 3.4s ease-in-out infinite; }
  .monkey   { left: 15%;   top: -17%; width: 21%;   animation: sway 4s ease-in-out infinite; transform-origin: 50% 90%; }
  .mouse    { left: 36.5%; top: -28%; width: 18%;   animation: bob 2.8s ease-in-out infinite -.8s; }
  .bear     { left: 77%;   top: -38%; width: 16.5%; animation: bob 3.1s ease-in-out infinite -1.6s; }
  .elephant { left: -23%;  bottom: 0; width: 19%;   animation: drum 1.6s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes bob { 50% { transform: translateY(-4%); } }
  @keyframes sway { 25% { transform: rotate(-2.5deg); } 75% { transform: rotate(2.5deg); } }
  @keyframes drum { 50% { transform: scaleY(.97); } }

  .rise { animation: rise .9s cubic-bezier(.2, .8, .2, 1) backwards; }
  .title.rise { animation-delay: .05s; }
  .date.rise { animation-delay: .2s; }
  .tagline.rise { animation-delay: .3s; }
  .badge-cta.rise { animation-delay: .45s; }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }

  /* Phones and portrait tablets: poster-style stack, sized in vw */
  @media (max-aspect-ratio: 4/5) {
    .stage { inset: 0; left: 0; width: auto; height: auto; transform: none; }
    .brand { left: 6vw; top: 7vw; width: 40vw; }
    .title { left: 5vw; top: 20vw; width: 72vw; }
    .date { left: 6vw; top: 61vw; font-size: 10vw; }
    .tagline { left: 6vw; top: 74vw; max-width: 86vw; font-size: 4.2vw; }
    .badge-cta {
      left: 6vw; right: 6vw; top: 93vw; height: 14vw; gap: 2vw; padding: 0 3.4vw 0 1.8vw;
      font-size: 3.15vw; justify-content: space-between; border-width: 2px; box-shadow: 0 1.4vw 0 var(--ink);
    }
    .badge-cta .tag { height: 10vw; padding: 0 2.8vw; gap: 1.6vw; font-size: 3.1vw; }
    .badge-cta .dot { width: 1.8vw; height: 1.8vw; }
    .badge-cta .meta { display: none; }
    .badge-cta svg { flex: none; width: 4.6vw; height: 4.6vw; }
    /* the scene shrinks on short phones so the roof characters never reach the button */
    .scene { width: min(100vw, (100vh - 112vw) / .87); }
    .elephant { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .rise, .scene img { animation: none; }
  }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <img class="elephant" src="assets/carnival/elephant.webp" alt="">
    <img class="building" src="assets/carnival/building.webp" alt="">
    <img class="frog" src="assets/carnival/frog.webp" alt="">
    <img class="monkey" src="assets/carnival/monkey.webp" alt="">
    <img class="mouse" src="assets/carnival/mouse.webp" alt="">
    <img class="bear" src="assets/carnival/bear.webp" alt="">
  </div>

  <main class="stage" aria-label="Space Carnival at TinkerSpace Kochi, December 19 and 20">
    <div class="brand"><img src="assets/logo.png" alt="TinkerSpace Kochi"></div>

    <h1 class="title rise"><img src="assets/carnival/wordmark.svg" alt="Space Carnival"></h1>

    <p class="date rise">Dec 19 <span>&amp;</span> 20</p>

    <p class="tagline rise">Four years of TinkerSpace. Come build, play and tinker with the community in Kochi.</p>

    <a class="badge-cta rise" href="badge/">
      <span class="tag"><i class="dot" aria-hidden="true"></i>Open</span>
      <span>PCB Badge Design Competition</span>
      <span class="meta">Closes Nov 26</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </a>
  </main>

<script>
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
